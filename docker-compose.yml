services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coding-profile-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=production-portfolio-secret-key-2026
      - DATABASE_URL=sqlite:///coding_profiles.db
    volumes:
      - backend-data:/app/instance
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coding-profile-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
